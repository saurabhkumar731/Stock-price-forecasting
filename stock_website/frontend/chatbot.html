<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot — Ledger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topnav">
  <div class="brand"><a href="index.html" style="color:inherit;">Ledger<em>.</em></a></div>
  <nav>
    <a href="predict.html">Predict</a>
    <a href="visualize.html">Visualize</a>
    <a href="chatbot.html" class="active">Chatbot</a>
  </nav>
  <div class="nav-right">
    <span class="muted" id="nav-username" style="margin-right:18px;"></span>
    <a href="#" class="btn" id="logout-btn">Log out</a>
  </div>
</div>

<div class="container" style="max-width:760px;">
  <h2>Ask about a stock</h2>
  <p class="muted" style="margin-bottom:24px;">Backed by a local Ollama model. Make sure <code>ollama serve</code> is running.</p>

  <div class="chat-window" id="chat-window"></div>

  <form class="chat-input-row" id="chat-form">
    <input type="text" id="chat-input" placeholder="e.g. What's the trend for TCS this month?" required>
    <button type="submit" class="btn btn-solid">Send</button>
  </form>
</div>

<script src="js/nav.js"></script>
<script src="js/chatbot.js"></script>
